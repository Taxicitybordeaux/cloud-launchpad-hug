<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Espace José — Taxi City Bordeaux</title>
    <link rel="manifest" href="/driver-manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TCB Chauffeur" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0f172a; font-family: system-ui, sans-serif; }
      .splash {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100dvh; gap: 16px; color: #fff;
      }
      .emoji { font-size: 56px; }
      .title { font-size: 20px; font-weight: 700; }
      .text { font-size: 14px; color: #94a3b8; text-align: center; padding: 0 32px; }
      .btn {
        margin-top: 24px; background: #fff; color: #0f172a; border: none;
        border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 700;
        cursor: pointer; text-decoration: none; display: inline-block;
      }
    </style>
    <script>
      localStorage.setItem("driver_token", "DSF234");

      // Détecte si on est lancé depuis la PWA installée (standalone)
      const isStandalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (isStandalone) {
        // Lancé depuis l'icône PWA → redirige immédiatement
        window.location.replace("/driver");
      }
      // Sinon on reste sur cette page pour que Safari lise le manifest
    </script>
  </head>
  <body>
    <div class="splash">
      <div class="emoji">🚕</div>
      <div class="title">Espace Chauffeur</div>
      <div class="text">
        Pour installer l'app :<br /><br />
        1. Appuie sur le bouton Partager
        <svg
          style="display:inline;vertical-align:middle"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
        >
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
          <polyline points="16 6 12 2 8 6" />
          <line x1="12" y1="2" x2="12" y2="15" /></svg
        ><br />
        2. Puis <strong style="color:#fff">"Sur l'écran d'accueil"</strong>
      </div>
      <a href="/driver" class="btn">▶ Accéder maintenant</a>
    </div>
  </body>
</html>
